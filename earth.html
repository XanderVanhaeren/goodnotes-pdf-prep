<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3D Earth Satellites</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #fff;
      background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
      font-family: Arial, sans-serif; font-size: 12px;
    }
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #fff; font-family: Arial, sans-serif;
    }
    #speedSlider { width: 200px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">Click a satellite</div>
  <div id="controls">
    <label for="speedSlider">Time Speed: <span id="speedVal">1.0x</span></label>
    <input type="range" id="speedSlider" min="0" max="10" step="0.1" value="1">
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(0, 0, 16000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Earth
    const earthGeo = new THREE.SphereGeometry(6378.137, 64, 64);
    const earthMat = new THREE.MeshBasicMaterial({ map: createEarthTexture(), color: 0xffffff });
    const earth = new THREE.Mesh(earthGeo, earthMat);
    earth.position.set(0, 0, 0);
    scene.add(earth);

    const atmosphereGeo = new THREE.SphereGeometry(6378.137 * 1.02, 64, 64);
    const atmosphereMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.2 });
    const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
    scene.add(atmosphere);

    // Stars
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 20000;
    const starsPos = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i++) starsPos[i] = (Math.random() - 0.5) * 2000;
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
    const stars = new THREE.Points(starsGeo, starsMat);
    stars.position.set(0, 0, 0);
    scene.add(stars);

    // Satellite materials
    const satGeo = new THREE.SphereGeometry(20, 80, 80);
    const materialMap = {
      active: new THREE.MeshBasicMaterial({ color: 0x00aaff }),
      rocket: new THREE.MeshBasicMaterial({ color: 0xff8800 }),
      debris: new THREE.MeshBasicMaterial({ color: 0x888888 })
    };

    // Constants
    const mu = 398600.4418;
    const R_E = 6378.137;
    const TAU = Math.PI * 2;
    let satelliteObjects = [];
    let satelliteMeshes = [];

    function createEarthTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;  // was 1024
      canvas.height = 1024; // was 512, keep aspect ratio ~2:1
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a2463';
      ctx.fillRect(0, 0, 1024, 512);
      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#3a7d44' : '#6b8e23';
        ctx.beginPath();
        ctx.ellipse(Math.random() * 1024, Math.random() * 512, 50 + Math.random() * 100, 30 + Math.random() * 60, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#e8f4f8';
      ctx.fillRect(0, 0, 1024, 8);
      ctx.fillRect(0, 504, 1024, 8);
      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    function addSatellite(a, e, i, Omega, omega, M0, type) {
      const n = Math.sqrt(mu / (a * a * a));
      const mesh = new THREE.Mesh(satGeo, materialMap[type]);
      scene.add(mesh);
      const obj = { mesh, a, e, i, Omega, omega, M0, n, type, name: generateName(type) };
      satelliteObjects.push(obj);
      satelliteMeshes.push(mesh);
      return obj;
    }

    function generateName(type) {
      if (type === 'active') return 'SAT-' + Math.floor(Math.random() * 9000 + 1000);
      if (type === 'rocket') return 'ROCKET-' + Math.floor(Math.random() * 1000);
      return 'DEB-' + Math.floor(Math.random() * 100000 + 1);
    }

    function pickType() {
      const r = Math.random();
      if (r < 0.5) return 'active';
      if (r < 0.6) return 'rocket';
      return 'debris';
    }

    function generateShells() {
      // LEO shells
      const leoShells = [
        { alt: 200, e: 0.0, inc: 98, count: 500 },
        { alt: 400, e: 0.0, inc: 45, count: 1500 },
        { alt: 600, e: 0.05, inc: 55, count: 1500 },
        { alt: 1000, e: 0.02, inc: 80, count: 1000 },
        { alt: 1500, e: 0.0, inc: 30, count: 1000 }
      ];
      for (let s of leoShells) {
        for (let i = 0; i < s.count; i++) {
          let a = R_E + s.alt;
          let e = s.e;
          let inc = s.inc * Math.PI / 180;
          let Omega = Math.random() * TAU;
          let omega = Math.random() * TAU;
          let M0 = Math.random() * TAU;
          let type = pickType();
          addSatellite(a, e, inc, Omega, omega, M0, type);
        }
      }
      // MEO shells
      const meoShells = [
        { a: 8378, e: 0.0, inc: 55, count: 100 },
        { a: 26562, e: 0.01, inc: 55, count: 100 },
        { a: 26600, e: 0.74, inc: 63.8, count: 50 },
        { a: 8000, e: 0.2, inc: 28, count: 200 },
        { a: 12000, e: 0.1, inc: 55, count: 200 },
        { a: 20000, e: 0.0, inc: 55, count: 100 }
      ];
      for (let s of meoShells) {
        for (let i = 0; i < s.count; i++) {
          let e = s.e;
          let inc = s.inc * Math.PI / 180;
          let Omega = Math.random() * TAU;
          let omega = Math.random() * TAU;
          let M0 = Math.random() * TAU;
          let type = pickType();
          addSatellite(s.a, e, inc, Omega, omega, M0, type);
        }
      }
      // GEO
      for (let i = 0; i < 200; i++) {
        let a = 42164;
        let e = 0.0;
        let inc = 0;
        let Omega = Math.random() * TAU;
        let omega = 0;
        let M0 = Math.random() * TAU;
        let type = pickType();
        addSatellite(a, e, inc, Omega, omega, M0, type);
      }
    }

    function solveKepler(M, e, tol = 1e-6) {
      let E = M;
      if (e > 0.8) E = Math.PI;
      for (let i = 0; i < 100; i++) {
        let f = E - e * Math.sin(E) - M;
        let fp = 1 - e * Math.cos(E);
        let dE = f / fp;
        E -= dE;
        if (Math.abs(dE) < tol) break;
      }
      return E;
    }

    function getPosition(obj, time) {
      let M = obj.M0 + obj.n * time;
      let E = solveKepler(M, obj.e);
      let nu = Math.atan2(Math.sqrt(1 - obj.e * obj.e) * Math.sin(E), Math.cos(E) - obj.e);
      let r = obj.a * (1 - obj.e * obj.e) / (1 + obj.e * Math.cos(nu));
      let x = r * Math.cos(nu);
      let y = r * Math.sin(nu);
      let z = 0;
      // Rz(omega)
      let x1 = Math.cos(obj.omega) * x - Math.sin(obj.omega) * y;
      let y1 = Math.sin(obj.omega) * x + Math.cos(obj.omega) * y;
      let z1 = z;
      // Rx(i)
      let x2 = x1;
      let y2 = Math.cos(obj.i) * y1 - Math.sin(obj.i) * z1;
      let z2 = Math.sin(obj.i) * y1 + Math.cos(obj.i) * z1;
      // Rz(Omega)
      let x3 = Math.cos(obj.Omega) * x2 - Math.sin(obj.Omega) * y2;
      let y3 = Math.sin(obj.Omega) * x2 + Math.cos(obj.Omega) * y2;
      let z3 = z2;
      return new THREE.Vector3(x3, y3, z3);
    }

    // Generate all satellites
    generateShells();

    // Camera controls
    const cameraState = { distance: 16000, phi: 1.2, theta: 0.5 };
    function updateCamera() {
      camera.position.set(
        cameraState.distance * Math.sin(cameraState.phi) * Math.sin(cameraState.theta),
        cameraState.distance * Math.cos(cameraState.phi),
        cameraState.distance * Math.sin(cameraState.phi) * Math.cos(cameraState.theta)
      );
      camera.lookAt(0, 0, 0);
    }
    updateCamera();

    let isDragging = false;
    let lastX = 0, lastY = 0;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerDown(e) {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    }
    function onPointerMove(e) {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      cameraState.theta -= dx * 0.005;
      cameraState.phi += dy * 0.005;
      cameraState.phi = Math.max(0.1, Math.min(1.5, cameraState.phi));
      lastX = e.clientX;
      lastY = e.clientY;
    }
    function onPointerUp(e) {
      if (isDragging) {
        isDragging = false;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(satelliteMeshes);
        if (intersects.length > 0) {
          const mesh = intersects[0].object;
          for (let obj of satelliteObjects) {
            if (obj.mesh === mesh) {
              showInfo(obj);
              break;
            }
          }
        }
      }
    }
    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerup', onPointerUp);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      cameraState.distance *= Math.exp(e.deltaY * 0.001);
      cameraState.distance = Math.max(100, Math.min(20000, cameraState.distance));
      updateCamera();
    }, { passive: false });

    // Info panel
    function showInfo(obj) {
      const infoDiv = document.getElementById('info');
      infoDiv.innerHTML = `
        <strong>${obj.name}</strong><br>
        Type: ${obj.type}<br>
        Altitude: ${obj.altitude.toFixed(0)} km<br>
        Speed: ${(obj.speed * 1000).toFixed(2)} m/s
      `;
    }

    // Animation
    const clock = new THREE.Clock();
    let simTime = 0;
    let speedMultiplier = 1;
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      simTime += delta * speedMultiplier;
      for (let obj of satelliteObjects) {
        let pos = getPosition(obj, simTime);
        obj.mesh.position.copy(pos);
        let r = pos.length();
        obj.altitude = r - R_E;
        obj.speed = Math.sqrt(mu * (2 / r - 1 / obj.a));
      }
      renderer.render(scene, camera);
    }
    animate();

    // Speed slider
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    speedSlider.addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
      speedVal.textContent = speedMultiplier.toFixed(1) + 'x';
    });

  </script>
</body>
</html>
